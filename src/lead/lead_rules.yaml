# Lead Agent rules: answers a person gave to the lead agent's questions (src/lead/rules.py).
# Each one is reported as answered instead of asked again. Written by `rules.py approve`; edit with care.
rules:
- question: evaluation:1:measure_note
  rule: 'Model 1''s options are picked by within-campaign AUC (smoother) and the winner is graded by redeemers caught
    in the top 20%: picking by redeemers caught would jump by whole households and pick partly by luck.'
  answer: Yes, obvious decision.
  decided_by: Pranav Jain
  decided_on: '2026-10-20'
- question: evaluation:1:MOD-07
  rule: A test campaign with too little finished history before it is left out of comparing options; options cannot
    be compared fairly on it. The summary says how many campaigns the comparison covers.
  answer: Yes, obvious decision.
  decided_by: Pranav Jain
  decided_on: '2026-10-20'
- question: evaluation:2:MOD-07
  rule: A test campaign with too little finished history before it is left out of comparing options; options cannot
    be compared fairly on it. The summary says how many campaigns the comparison covers.
  answer: Yes, obvious decision.
  decided_by: Pranav Jain
  decided_on: '2026-10-20'
- question: evaluation:3:MOD-07
  rule: A test campaign with too little finished history before it is left out of comparing options; options cannot
    be compared fairly on it. The summary says how many campaigns the comparison covers.
  answer: Yes, obvious decision.
  decided_by: Pranav Jain
  decided_on: '2026-10-20'
- question: evaluation:3:measure_note
  rule: Model 3 is judged on the propensity-weighted, within-campaign Qini (ipw_stratified_qini), not the unweighted
    pooled Qini. It already combines common-support trimming (rows outside in_overlap are dropped) with inverse-propensity
    weighting inside that region, which is a more complete fix for non-random targeting than trimming alone.
  answer: Accepted. ipw_stratified_qini already restricts to the overlap region (in_overlap) before weighting, which
    is the common-support fix I'd been planning to add separately -- no need to build a second one.
  decided_by: Shreya Shetty
  decided_on: '2026-10-21'
