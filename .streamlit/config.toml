# Decision Lab theme. Hex values are the validated palette from the project's dataviz skill
# (references/palette.md): categorical slot 6 (green) as the accent -- in the spirit of TD's
# branding, not a claim to the exact brand hex -- the light chart surfaces as backgrounds,
# primary/secondary ink for text. Not eyeballed -- these are the pre-validated steps.
[theme]
primaryColor = "#008300"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
